<style>
:root{--ink:#1c1530;--muted:#5b536e;--bg:#f6f4fa;--card:#fff;--line:#d9d3e6;--brand:#2d0052;--accent:#6b2fa8;--warn:#8a4b00;--warnbg:#fff4e0;--ok:#145c2e;--okbg:#e6f5ec;--bad:#9b1c1c}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--brand);color:#fff;padding:20px 16px}
header .in,main{max-width:980px;margin:0 auto}
header h1{margin:0;font-size:1.5rem}
header p{margin:4px 0 0;opacity:.9}
main{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
h2{font-size:1.2rem;margin:0 0 8px}
h3{font-size:1.02rem;margin:16px 0 6px}
label{display:block;font-weight:600;margin:12px 0 4px}
.opt label,.chk label{display:inline;font-weight:400}
input[type=text],select,textarea{width:100%;padding:8px;border:1px solid #8d84a3;border-radius:6px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:76px}
:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.lever{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0}
.lever b{display:block}.lever small{color:var(--muted)}
.chk{display:block;margin:4px 0}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;margin:4px 8px 4px 0;text-decoration:none}
.btn.alt{background:#fff;color:var(--accent);border:2px solid var(--accent)}
.btn.small{padding:4px 10px;font-size:.9rem}
.notice{background:#efe9fa;border-left:4px solid var(--accent);padding:10px 12px;border-radius:6px;margin:10px 0}
.flag{background:var(--warnbg);border-left:4px solid var(--warn);padding:8px 12px;margin:8px 0;border-radius:6px}
.err{color:var(--bad);font-weight:600;margin:8px 0}
.ok{background:var(--okbg);border-left:4px solid var(--ok);padding:8px 12px;border-radius:6px}
.ev{border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:8px;padding:10px 12px;margin:10px 0;background:#fcfbff}
.ev h4{margin:0 0 4px;font-size:1rem}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:99px;background:#e3d9f5;margin-right:6px}
.tag.g{background:#ffe2b8}
.cite{font-size:.85rem;color:var(--muted)}
.cite a{color:var(--accent)}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.mods a{display:block;border:1px solid var(--line);background:#fff;border-radius:8px;padding:12px;text-decoration:none;color:var(--ink)}
.mods a b{color:var(--accent)}
.entry{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;background:#fff}
.entry dl{margin:6px 0}.entry dt{font-weight:700;margin-top:4px}.entry dd{margin:0 0 0 12px}
.prog{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px 16px;margin:0 0 16px}
.prog h2{margin:0 0 6px}
.bar{height:14px;background:#ece7f5;border-radius:99px;overflow:hidden;margin:6px 0 10px}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.phase{border:1px solid var(--line);border-radius:8px;padding:8px}
.phase.done{border-color:var(--ok);background:var(--okbg)}
.phase b{display:block;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-block;min-width:34px;text-align:center;padding:3px 8px;border-radius:99px;border:2px solid var(--accent);color:var(--accent);font-weight:700;font-size:.85rem;text-decoration:none;background:#fff}
.chip.on{background:var(--accent);color:#fff}
.chip.here{outline:3px solid #ffbf47;outline-offset:1px}
.next{margin:10px 0 0;font-weight:600}
.print-only{display:none}
@media print{header,.noprint,.btn{display:none!important}.print-only{display:block}body{background:#fff}.card{border:0;padding:0}}
</style>

function flagsFor(m){
  var fl=[];
  if(m===1){
    var t=val("theory"),st=val("structural"),first=val("first");
    var lv=document.querySelectorAll('select[id^="lv"]'),allHigh=lv.length>0,anyBlank=false;
    lv.forEach(function(s){if(s.value!=="High")allHigh=false;if(!s.value)anyBlank=true;});
    if(st==="Yes"&&t)fl.push("You noted a cost, access or policy barrier. TPB and HBM mostly describe individual beliefs. Ask what a systems-level lens would add (see the Golden & Earp card).");
    if(allHigh&&!anyBlank)fl.push("Every construct is rated High, yet you are asking what to target. If beliefs are all favorable, the gap may be intention-to-action. See the Rich and Hagger cards.");
    if(t==="Theory of Planned Behavior"&&first==="Self-efficacy / perceived control")fl.push("You chose perceived control first. The Hagger card suggests it shapes whether intention turns into behavior; say how you would build it.");
    if(t==="Health Belief Model"&&first==="Cues to action")fl.push("Cues to action had the largest effect in the Ritchie screening review. That review covered mammography only, so say why it applies here.");
  }
  if(m===2){
    var bs=[],ps=[];
    for(var k=0;k<4;k++){bs.push(val("pb"+k));ps.push(val("pp"+k));}
    var blanks=ps.filter(function(x){return !x;}).length+bs.filter(function(x){return !x;}).length;
    if(blanks)fl.push("You left "+blanks+" barrier or partner choice(s) blank. A pathway is only as strong as its weakest stage.");
    var cnt={};ps.forEach(function(x){if(x)cnt[x]=(cnt[x]||0)+1;});
    Object.keys(cnt).forEach(function(x){if(cnt[x]>=3)fl.push("You chose "+x+" for "+cnt[x]+" of 4 stages. One partner rarely holds the access and trust needed at every stage; who else could share the load?");});
    var mis=[],gap=[];
    for(var q=0;q<4;q++){
      if(bs[q]==="Mistrust of health care"&&(ps[q]==="Health system / clinic"||ps[q]==="Payer / insurer"))mis.push(STAGES_P[q]);
      if(bs[q]==="No formal agreement or contact between partners"&&ps[q]==="Food bank / pantry")gap.push(STAGES_P[q]);
    }
    if(mis.length)fl.push("At "+mis.join(", ")+" the barrier is mistrust, but the partner is part of the system that is mistrusted. Who holds trust here? (See the LaVeist card.)");
    if(gap.length)fl.push("At "+gap.join(", ")+" the barrier is a missing link between partners; a partner on one side cannot fix that alone. Who connects them?");
    var anyComm=ps.some(function(x){return x&&x!=="Health system / clinic"&&x!=="Payer / insurer";});
    if(ps.some(function(x){return x;})&&!anyComm)fl.push("All your partners are health-sector. Which community partner holds trust and access the clinic does not? (See the Golden & Earp card.)");
  }
  if(m===3){
    var B=checked("barriers"),d=val("delivery");
    if(B.indexOf("Digital access or skills")>-1&&d==="Digital only")fl.push("You selected a digital-access barrier but chose digital-only delivery. Reconcile these (see the Smith card).");
    if(B.indexOf("Mistrust of health care")>-1&&d==="Digital only")fl.push("Mistrust is selected and delivery is digital-only. Who is the trusted face of the program? (See the LaVeist card.)");
    if((B.indexOf("Cost")>-1||B.indexOf("Transportation")>-1)&&d==="In person only")fl.push("Cost or transportation is a barrier and delivery is in person only. What removes that barrier?");
    if(B.length===0)fl.push("You selected no barriers. Which ones could be present but invisible in your data?");
  }
  if(m===4){
    var a=val("approach"),pth=checked("path"),w=checked("weigh");
    if(a&&a!=="Do not screen; focus on prevention"&&pth.indexOf("A confirmed program to refer to")<0)fl.push("You are screening without a confirmed program to refer to. What happens to a positive result?");
    if(a&&a!=="Do not screen; focus on prevention"&&w.indexOf("False positives")<0&&w.indexOf("Overdiagnosis")<0)fl.push("You did not weigh screening harms. See the Welch & Black card, then say whether harms apply here.");
    if(a==="Start screening earlier based on family history"&&val("fhnote")==="")fl.push("Earlier screening based on family history needs a documented family history. How will it be collected and checked? (See the Valdez card.)");
  }
  if(m===5){
    var f=val("fh"),c=checked("changes");
    if(f==="None known"&&c.length>0&&c.indexOf("No change")<0)fl.push("No family history is known, yet you changed the plan. What is driving the change?");
    if((f==="First-degree relative(s) affected"||f==="Multiple generations affected")&&c.indexOf("No change")>-1)fl.push("Strong family history but “no change.” Say why that is reasonable.");
    if(f&&f!=="None known"&&checked("env").length===0)fl.push("You named no environmental factors. Family history shares genes and environments; which shared environment matters here?");
  }

  if(m===6){
    var nd=checked("nodes"),ap=checked("apath");
    if(nd.length<2)fl.push("Your algorithm has fewer than two decision points. A single cutoff will send people the wrong way at the edges. What else would you ask?");
    if(nd.indexOf("Social needs screen (food, housing, transport)?")<0)fl.push("No social needs decision point. A referral the person cannot reach does not close the gap (see the LaVeist card on follow-up).");
    if(nd.indexOf("Family history of the condition?")>-1)fl.push("You use family history as a decision point. Say how it will be collected and checked (see the Valdez card).");
    if(ap.indexOf("A clinician or navigator can override the algorithm")<0)fl.push("No human override. When would a clinician or navigator be allowed to override the result?");
    if(ap.indexOf("A named person who owns the result")<0)fl.push("No named owner for the result. Who makes sure a high-risk result is acted on?");
    if(val("refout")==="Monitor and re-screen later"&&ap.indexOf("A time frame for follow-up")<0)fl.push("You chose monitor and re-screen without a time frame. When, and who triggers it?");
    if(nd.length&&val("entry")==="A screening result"&&checked("apath").indexOf("The result explained in plain language")<0)fl.push("The algorithm starts from a screening result, but the result is not explained in plain language. What does the person hear?");
  }
  if(m===7){
    var tr=checked("tiers"),ac=checked("actors");
    if(tr.length===0)fl.push("You selected no tiers. Which tier does your main strategy sit in?");
    if(tr.length>0&&tr.length===1&&tr[0]===TIERS[4])fl.push("Your strategy sits only in education and counseling, the top tier of the pyramid. Frieden describes lower tiers as generally reaching more people with less effort from each person. What could move down a tier?");
    if(tr.length>0&&tr.indexOf(TIERS[0])<0&&tr.indexOf(TIERS[1])<0)fl.push("Neither of the bottom two tiers (determinants or context change) is in your strategy. Those are where Frieden places the greatest potential impact.");
    if(ac.length===1&&ac[0]==="The individual")fl.push("Only the individual has to act. See the Golden & Earp card on how many programs target individuals rather than systems.");
    if(val("plevel")==="Tertiary (reduce harm in people who have it)"&&tr.indexOf(TIERS[4])>-1&&tr.length===1)fl.push("A tertiary strategy delivered only through counseling. What stops the next person from reaching this point?");
  }
  if(m===8){
    var pr=checked("pred"),en=checked("enab"),rn=checked("rein"),g=val("gap"),iv=val("intv");
    if(g==="Enabling"&&iv==="Teaching or informing")fl.push("You named an enabling gap but your intervention mainly teaches. Teaching addresses predisposing factors. What changes access, cost or skills?");
    if(g==="Reinforcing"&&iv==="Teaching or informing")fl.push("You named a reinforcing gap but the intervention mainly teaches. What keeps the behavior going after the session ends?");
    if(iv==="Teaching or informing")fl.push("The Kim review pooled only knowledge outcomes. Knowledge gains do not show that behavior changed (see also the Rich card).");
    if(pr.length+en.length+rn.length===0)fl.push("You selected no factors. Which ones shape this behavior in the case?");
    if(en.length>0&&g==="Predisposing")fl.push("You listed enabling barriers but named predisposing as the biggest gap. Explain why beliefs outweigh the access problems you listed.");
  }
  if(m===9){
    var hf=val("handoff"),lp=checked("loop"),rc=checked("reach");
    if(hf==="Gives the person a name, number or flyer"&&lp.indexOf("Someone confirms the person arrived")<0)fl.push("The handoff gives information only and nobody confirms arrival. Where does the person go if they do not call?");
    if(hf==="Gives the person a name, number or flyer")fl.push("This is a cold handoff. What would a warm handoff (an introduction or a booked first contact) look like for this partner?");
    if(val("agree")==="Informal; no agreement")fl.push("The partner relationship is informal. What happens to this link when one contact leaves?");
    if(rc.length<5)fl.push("Not every access check is confirmed ("+(5-rc.length)+" open). A referral to a resource the person cannot reach does not close the gap.");
    if(lp.length===0)fl.push("You have no way to close the loop. How will you know whether the person got there?");
  }
  if(m===10){
    var ch=checked("chan"),fm=checked("fmt"),lt=val("lit");
    if((lt==="Likely limited"||lt==="Unknown")&&fm.indexOf("Plain language")<0)fl.push("Literacy is limited or unknown and plain language is not selected. Berkman links low health literacy to poorer use of care and poorer message interpretation.");
    if((lt==="Likely limited"||lt==="Unknown")&&fm.indexOf("Teach-back (person explains it in their own words)")<0)fl.push("How will you find out whether the person understood? Without a check, you only know what you sent.");
    if(fm.indexOf("Essential information first")<0)fl.push("Sheridan found that presenting essential information first improved comprehension in some studies. Where does your key message sit?");
    if(ch.length===1)fl.push("One channel only. Who does it miss, and what is the backup?");
    if(ch.length>0&&ch.every(function(x){return x==="Text message"||x==="Patient portal"||x==="Printed handout";})&&val("obj")==="Build a skill")fl.push("You want to build a skill but chose only text, portal or print. Can a skill be learned without seeing or practicing it?");
    if(val("obj")==="Reduce a barrier such as fear or mistrust"&&ch.indexOf("In-person conversation")<0&&ch.indexOf("Community event")<0)fl.push("You want to reduce fear or mistrust without a personal channel. Who is the trusted messenger? (See the LaVeist card.)");
  }
  if(m===11){
    var co=checked("core"),ad=checked("adapt");
    if(co.length===0)fl.push("You named no core components. Without them you cannot tell an adaptation from drift.");
    if(ad.indexOf("Content or curriculum")>-1&&co.indexOf("Content or curriculum")>-1)fl.push("Content is both a core component and something you will adapt. Which parts are fixed, and which parts can change?");
    if(ad.indexOf("Staffing")>-1&&co.indexOf("Who delivers it")>-1)fl.push("Staffing is both core and adapted. Say who can deliver the program and who cannot.");
    if(val("measimp")!=="Yes")fl.push("You will not track delivery. Durlak and DuPre treat implementation data as an essential part of evaluation, because results depend on how well a program is delivered.");
    if(val("risk")==="Training or technical support")fl.push("You named training or support as the biggest risk. Who provides it, and how often?");
    if(ad.length>=4)fl.push("You are adapting "+ad.length+" things. At what point is this a different program?");
  }
  if(m===12){
    var pc=checked("proc"),oc=checked("outc"),ra=checked("reaim"),ds=val("design"),sx=val("stat");
    if(oc.length&&!pc.length)fl.push("You have outcomes but no process indicators. If outcomes do not improve, you will not know whether the program was delivered.");
    if(pc.length&&!oc.length)fl.push("You have process indicators but no outcome indicators. Delivery alone does not show benefit.");
    if(ds==="Before and after, one group")fl.push("With one group before and after, change could come from other things (time, other services, who stayed in). Mudaliar’s review of DPP programs had mostly this design. Say what else could explain a change.");
    if(sx==="Not chosen yet"||sx==="")fl.push("No statistic or interval chosen. The Evaluation Framework asks you to name one and say what it would and would not show.");
    if(sx&&sx!=="Not chosen yet")fl.push("A P value or interval does not show that your program caused the change or that the change matters to the person. See the Greenland card for common misreadings.");
    var miss=REAIM.filter(function(x){return ra.indexOf(x)<0;});
    if(ra.length&&miss.length)fl.push("Your plan does not cover: "+miss.join(", ")+" (Glasgow RE-AIM).");
  }
  return fl;
}

function labelFor(id){var e=document.querySelector('label[for="'+id+'"]');return e?e.textContent:id;}
function gather(m){
  var inputs=[];

  add("Case",val("case"));add("Population note",val("popnote"));add("Life stage",val("stage"));add("Concern in focus",val("concern"));
  if(m===1){add("Theory",val("theory"));
    var cons=[];document.querySelectorAll('select[id^="lv"]').forEach(function(s){var b=s.parentNode.querySelector("b");cons.push((b?b.textContent:"")+": "+(s.value||"not rated"));});
    add("Construct ratings",cons);add("Target first",val("first"));add("Structural barrier present",val("structural"));}
  if(m===2){var pl=[];for(var k=0;k<4;k++)pl.push(STAGES_P[k]+": barrier = "+(val("pb"+k)||"blank")+"; partner = "+(val("pp"+k)||"blank"));
    add("Pathway map",pl);add("Holds the power",val("power"));}
  if(m===3){add("Barriers",checked("barriers"));add("Delivery",val("delivery"));}
  if(m===4){add("Screening approach",val("approach"));add("Weighing",checked("weigh"));add("Pathway includes",checked("path"));add("Family history documentation",val("fhnote"));}
  if(m===5){add("Family history",val("fh"));add("Environmental factors",checked("env"));add("Plan changes",checked("changes"));}

  if(m===6){add("Entry point",val("entry"));add("Decision points",checked("nodes"));add("High-risk result sends person to",val("refout"));add("Pathway includes",checked("apath"));}
  if(m===7){add("Level of prevention",val("plevel"));add("Pyramid tiers reached",checked("tiers"));add("Who has to act",checked("actors"));}
  if(m===8){add("Predisposing",checked("pred"));add("Enabling",checked("enab"));add("Reinforcing",checked("rein"));add("Biggest gap",val("gap"));add("Intervention mainly works by",val("intv"));}
  if(m===9){add("Partner",val("partner"));add("Handoff",val("handoff"));add("Relationship",val("agree"));add("Access confirmed",checked("reach"));add("Loop closed by",checked("loop"));}
  if(m===10){add("Message objective",val("obj"));add("Audience literacy",val("lit"));add("Channels",checked("chan"));add("Understandability",checked("fmt"));}
  if(m===11){add("Core components",checked("core"));add("Adaptations",checked("adapt"));add("Biggest risk",val("risk"));add("Track delivery",val("measimp"));}
  if(m===12){add("Process indicators",checked("proc"));add("Outcome indicators",checked("outc"));add("Design",val("design"));add("Statistic",val("stat"));add("RE-AIM covered",checked("reaim"));}

function save(m){
  var err=document.getElementById("err");err.textContent="";
  var miss=[];
  if(!val("case"))miss.push("who or what the decision is about");
  if(!val("stage"))miss.push("life stage");
  if(!val("concern"))miss.push("behavior or health concern");
  if(val("decision").length<30)miss.push("your decision (at least a couple of sentences)");
  MODS[m].prompts.forEach(function(q,i){if(val("p"+i).length<30)miss.push("an answer to reasoning question "+(i+1));});
  if(!val("cyear"))miss.push("the year(s) of your evidence");
  if(!radioVal("cver"))miss.push("whether you checked for newer data");
  if(val("cfound").length<10)miss.push("what you found in the currency check");
  if(!document.getElementById("evidence").firstChild)miss.push("a look at the evidence cards (use the “Check my choices” button)");
  if(miss.length){err.textContent="Before saving, please add: "+miss.join("; ")+".";err.scrollIntoView&&err.scrollIntoView({block:"center"});return;}
  var pr=MODS[m].prompts.map(function(q,i){return {q:q,a:val("p"+i)};});
  log.push({id:Date.now()+"-"+log.length,m:m,mname:MODS[m].n,ts:new Date().toISOString(),inputs:gather(m),flags:flagsFor(m),decision:val("decision"),prompts:pr,
    currency:{year:val("cyear"),verified:radioVal("cver"),found:val("cfound")}});
  var ok=persist();
  var st=h("div",{class:"ok",role:"status",text:ok?"Saved to your log below. Export it before you close this tab.":"Saved for this session only: your browser blocked storage, so export your log now."});
  err.parentNode.insertBefore(st,err);
  renderLog();
}

var PHASES=[["Mobilize",[1,2]],["Assess",[3,4,5,6]],["Plan",[7,8,9,10]],["Implement",[11]],["Track",[12]]];
function progCard(cur){var c=h("div",{class:"prog noprint",id:"prog"});c.setAttribute("data-cur",cur||0);setTimeout(renderProgress,0);return c;}
function renderProgress(){
  var box=document.getElementById("prog");if(!box)return;var cur=parseInt(box.getAttribute("data-cur"),10)||0;box.textContent="";
  var done={};log.forEach(function(e){done[e.m]=true;});
  var total=Object.keys(MODS).length,n=Object.keys(done).filter(function(k){return MODS[k];}).length,pct=Math.round(n/total*100);
  box.appendChild(h("h2",{text:"Decision Log progress: "+n+" of "+total+" modules"}));
  var b=h("div",{class:"bar",role:"progressbar","aria-valuemin":"0","aria-valuemax":String(total),"aria-valuenow":String(n),"aria-label":"Modules logged"},h("span"));
  b.firstChild.style.width=pct+"%";box.appendChild(b);
  var g=h("div",{class:"phases"});
  PHASES.forEach(function(p){
    var all=p[1].every(function(k){return done[k];});
    var ph=h("div",{class:"phase"+(all?" done":"")},h("b",{text:p[0]+(all?" ✓":"")}));
    var ch=h("div",{class:"chips"});
    p[1].forEach(function(k){ch.appendChild(h("a",{href:"?m="+k,class:"chip"+(done[k]?" on":"")+(k===cur?" here":""),
      "aria-label":"Module "+k+": "+MODS[k].n+(done[k]?" (logged)":" (not logged yet)"),title:MODS[k].n,text:(done[k]?"✓ ":"")+k}));});
    ph.appendChild(ch);g.appendChild(ph);
  });
  box.appendChild(g);
  var nx=0;for(var k=1;k<=total;k++){if(!done[k]){nx=k;break;}}
  if(!nx)box.appendChild(h("p",{class:"next",text:"All 12 entries logged. Export your log for your Final Portfolio appendix."}));
  else if(nx!==cur)box.appendChild(h("p",{class:"next"},"Next up: ",h("a",{href:"?m="+nx,text:"Module "+nx+": "+MODS[nx].n})));
  else box.appendChild(h("p",{class:"next",text:"You are on your next entry: Module "+nx+". Save it below to fill this bar."}));
}
function exportBackup(){
  var data=JSON.stringify({hub:"bridgewell_v2",name:studentName,saved:new Date().toISOString(),log:log},null,1);
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));
  a.download="Bridgewell_Progress_"+(studentName.trim()||"student").replace(/[^A-Za-z0-9]+/g,"_")+".json";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function importBackup(file){
  var r=new FileReader();
  r.onload=function(){
    try{var d=JSON.parse(r.result);var list=Array.isArray(d)?d:d.log;if(!Array.isArray(list))throw 0;
      var have={};log.forEach(function(e){have[e.id]=true;});var added=0;
      list.forEach(function(e){if(e&&e.id&&MODS[e.m]&&e.inputs&&e.prompts&&e.currency&&!have[e.id]){log.push(e);have[e.id]=true;added++;}});
      log.sort(function(a,b){return (a.ts||"")<(b.ts||"")?-1:1;});
      if(!studentName&&d.name)studentName=String(d.name);
      persist();renderLog();window.alert(added?("Loaded "+added+(added===1?" entry.":" entries.")):"No new entries found in that file.");
    }catch(e){window.alert("That file is not a Bridgewell progress file. Use the .json file from “Save progress file.”");}
  };
  r.readAsText(file);
}
function logCard(){var c=h("div",{class:"card",id:"logcard"});c.appendChild(h("div",{id:"loginner"}));setTimeout(renderLog,0);return c;}
function renderLog(){
  renderProgress();var box=document.getElementById("loginner");if(!box)return;box.textContent="";
  box.appendChild(h("h2",{text:"My Decision Log ("+log.length+(log.length===1?" entry":" entries")+")"}));
  box.appendChild(h("label",{for:"sname",class:"noprint",text:"Your name (needed for export)"}));
  var ni=h("input",{type:"text",id:"sname",class:"noprint"});ni.value=studentName;ni.addEventListener("input",function(){studentName=ni.value;persist();});box.appendChild(ni);
  var fi=h("input",{type:"file",accept:".json,application/json",id:"loadfile",class:"noprint",onchange:function(){if(fi.files[0])importBackup(fi.files[0]);fi.value="";}});
  var loadRow=h("div",{class:"noprint"},h("label",{for:"loadfile",text:"Switched devices or browsers? Load your progress file (.json)"}),fi);
  if(!log.length){box.appendChild(h("p",{text:"No entries yet. Complete a module task and save it here."}));box.appendChild(loadRow);return;}
  log.forEach(function(e,i){
    var dl=h("dl");
    e.inputs.forEach(function(p){dl.appendChild(h("dt",{text:p[0]}));dl.appendChild(h("dd",{text:p[1]}));});
    dl.appendChild(h("dt",{text:"Decision"}));dl.appendChild(h("dd",{text:e.decision}));
    e.prompts.forEach(function(p){dl.appendChild(h("dt",{text:p.q}));dl.appendChild(h("dd",{text:p.a}));});
    dl.appendChild(h("dt",{text:"Currency check"}));
    dl.appendChild(h("dd",{text:"Evidence year(s): "+e.currency.year+". Checked for newer data: "+e.currency.verified+". "+e.currency.found}));
    box.appendChild(h("div",{class:"entry"},h("b",{text:"Module "+e.m+": "+e.mname}),h("span",{class:"cite",text:"  "+new Date(e.ts).toLocaleString()}),dl,
      h("button",{class:"btn alt small noprint",type:"button",text:"Delete this entry",onclick:function(){if(window.confirm("Delete this log entry?")){log.splice(i,1);persist();renderLog();}}})));
  });
  var bar=h("div",{class:"noprint"});
  bar.appendChild(h("button",{class:"btn",type:"button",text:"Export as text file",onclick:exportText}));
  bar.appendChild(h("button",{class:"btn alt",type:"button",text:"Print or save as PDF",onclick:function(){if(!studentName.trim()){window.alert("Add your name first.");return;}window.print();}}));
  bar.appendChild(h("button",{class:"btn alt",type:"button",text:"Save progress file (.json)",onclick:exportBackup}));
  box.appendChild(bar);box.appendChild(h("p",{class:"cite noprint",text:"The text file or PDF is what you attach to assignments. The progress file lets you reload your log on another device or browser."}));box.appendChild(loadRow);
  box.appendChild(h("div",{class:"print-only",text:"Name: "+studentName+" · Printed "+new Date().toLocaleDateString()}));
}
function exportText(){
  if(!studentName.trim()){window.alert("Add your name first.");return;}
  var L=["BRIDGEWELL DECISION LOG — ALH 4105","Name: "+studentName,"Exported: "+new Date().toLocaleString(),"",
    "Reminder: evidence cards may be several years old. Check for newer data before citing.",""];
  log.forEach(function(e,i){
    L.push("=== Entry "+(i+1)+" — Module "+e.m+": "+e.mname+" ("+new Date(e.ts).toLocaleString()+") ===");
    e.inputs.forEach(function(p){L.push(p[0]+": "+p[1]);});
    if(e.flags&&e.flags.length){L.push("Flags shown to student:");e.flags.forEach(function(f){L.push("  - "+f);});}
    L.push("Decision: "+e.decision);
    e.prompts.forEach(function(p){L.push(p.q);L.push("  "+p.a);});
    L.push("Currency check: evidence year(s) "+e.currency.year+"; checked for newer data: "+e.currency.verified+"; "+e.currency.found);L.push("");
  });
  var blob=new Blob([L.join("\r\n")],{type:"text/plain"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="Bridgewell_Decision_Log_"+studentName.trim().replace(/[^A-Za-z0-9]+/g,"_")+".txt";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}
